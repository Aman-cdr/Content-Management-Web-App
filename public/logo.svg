<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main gradient for the icon -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Subtle shine overlay -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Subtle grid pattern (content management feel) -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="176" y1="80" x2="176" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="336" y1="80" x2="336" y2="432"/>
    <line x1="80" y1="176" x2="432" y2="176"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="336" x2="432" y2="336"/>
  </g>

  <!-- Main "C" letterform — representing Content/Creator -->
  <g filter="url(#shadow)">
    <!-- Outer C shape -->
    <path d="M310 148 
             C310 148 358 148 358 148
             C358 148 358 164 358 164
             C358 164 310 164 310 164
             C244 164 192 216 192 282
             C192 348 244 400 310 400
             L358 400
             L358 416
             L310 416
             C234 416 172 356 172 282
             C172 208 234 148 310 148Z" 
          fill="url(#brandGrad)" opacity="0.15"/>
    
    <!-- Stylized C with modern geometric cuts -->
    <path d="M296 132
             C210 132 140 202 140 288
             C140 374 210 444 296 444
             C332 444 364 432 390 412
             L370 392
             L340 362
             L324 378
             C308 390 296 396 280 398
             C287 399 291 400 296 400
             C240 400 194 354 194 288
             C194 222 240 176 296 176
             C324 176 348 188 366 206
             L388 184
             C364 158 334 132 296 132Z"
          fill="url(#brandGrad)"/>
  </g>

  <!-- Content blocks / dashboard element — representing CMS -->
  <g filter="url(#glow)">
    <!-- Top-right content card -->
    <rect x="300" y="160" width="80" height="56" rx="10" fill="url(#brandGrad)" opacity="0.9"/>
    <rect x="312" y="174" width="36" height="4" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="312" y="184" width="52" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
    <rect x="312" y="192" width="44" height="3" rx="1.5" fill="#fff" opacity="0.25"/>
    <rect x="312" y="200" width="28" height="3" rx="1.5" fill="#fff" opacity="0.15"/>

    <!-- Middle-right content card -->
    <rect x="316" y="232" width="72" height="56" rx="10" fill="url(#brandGrad)" opacity="0.6"/>
    <rect x="328" y="246" width="32" height="4" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="328" y="256" width="46" height="3" rx="1.5" fill="#fff" opacity="0.35"/>
    <rect x="328" y="264" width="38" height="3" rx="1.5" fill="#fff" opacity="0.2"/>

    <!-- Bottom-right content card -->
    <rect x="308" y="304" width="76" height="56" rx="10" fill="url(#brandGrad)" opacity="0.35"/>
    <rect x="320" y="318" width="30" height="4" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="320" y="328" width="48" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
    <rect x="320" y="336" width="40" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  </g>

  <!-- Cursor / editing indicator -->
  <rect x="348" y="172" width="2" height="14" rx="1" fill="#fff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Shine overlay -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#shine)" opacity="0.5"/>
</svg>
